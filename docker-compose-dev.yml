version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: n8n-mysql-dev
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: n8n_dev
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: n8n
      MYSQL_PASSWORD: n8n
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: n8n-redis-dev
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  mysql_data: