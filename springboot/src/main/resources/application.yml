server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: n8n-backend

  profiles:
    active: dev

  datasource:
    url: jdbc:mysql://localhost:3306/n8n?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: n8n
    password: n8n
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      jedis:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: -1ms
      timeout: 5s

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false
    baseline-version: 1

  cache:
    type: redis
    redis:
      time-to-live: 1800000 # 30 minutes
      cache-null-values: false

# Custom properties
n8n:
  security:
    jwt:
      secret: n8n-jwt-secret-key-change-this-in-production
      expiration: 86400000 # 24 hours
      refresh-token-expiration: 1209600000 # 14 days

  execution:
    max-concurrent-executions: 10
    execution-timeout: 3600000 # 1 hour
    retry-attempts: 3
    retry-delay: 5000 # 5 seconds

# Logging
logging:
  level:
    xyz.oiio.n8n: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

---
# Development profile
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:mysql://localhost:3306/n8n_dev?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

logging:
  level:
    root: INFO

---
# Production profile
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DB_URL:jdbc:mysql://mysql:3306/n8n}
    username: ${DB_USERNAME:n8n_user}
    password: ${DB_PASSWORD:n8n_password}

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

n8n:
  security:
    jwt:
      secret: ${JWT_SECRET:n8n-jwt-secret-key-change-this-in-production}

logging:
  level:
    root: WARN
    xyz.oiio.n8n: INFO